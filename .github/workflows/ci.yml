name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/
      - name: dist al día
        run: python3 scripts/build.py && git diff --exit-code dist/
